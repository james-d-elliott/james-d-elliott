name: profile

on:
  schedule:
    - cron: "17 19 * * *" # daily, ~06:17 Melbourne
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "tools/profile/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch telemetry and render
        env:
          # Optional PROFILE_TOKEN secret (a personal token) makes the stats match what you see when
          # signed in; without it the workflow token sees only public data.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 tools/profile/profile.py

      - name: Commit changes
        run: |
          git add README.md assets/profile data
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(profile): refresh stats"
          git push
